name: Bootstrap npm lockfile

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/v1-foundation]
    paths:
      - '.github/workflows/bootstrap-lockfile.yml'
      - 'package.json'
      - 'apps/*/package.json'
      - 'packages/*/package.json'

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mohammedsaas
    steps:
      - name: Runner diagnostics
        run: |
          node --version
          npm --version
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate npm lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Upload lockfile artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm-lockfile
          path: package-lock.json
          if-no-files-found: error
