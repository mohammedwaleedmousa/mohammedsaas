name: V1 CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/v1-foundation]

permissions:
  contents: read

concurrency:
  group: v1-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: V1 verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mohammedsaas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mohammedsaas"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: 'true'
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mohammedsaas
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install reproducibly
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Migrate clean PostgreSQL database
        run: npm run db:deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: PostgreSQL integration and security tests
        run: npm run test:db

      - name: Build
        run: npm run build
